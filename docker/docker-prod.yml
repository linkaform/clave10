services:
  clave10:
    image: linkaform/clave10:develop
    container_name: clave10
    build: 
      context: ../ 
      dockerfile: Dockerfile
      target: develop

    volumes:
      # - ./:/srv
      - ./src:/srv/src/
      - ./public:/srv/public/
      - ./cache:/srv/cache/
    ports:
      - "3000:3000"
    stdin_open: true
    command: yarn dev
    tty: true
